name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Bash and zsh integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out shemacs
        uses: actions/checkout@v4
        with:
          path: shemacs

      - name: Check out sheme
        uses: actions/checkout@v4
        with:
          repository: jordanhubbard/sheme
          path: sheme

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y expect zsh

      - name: Install current Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Show shell versions
        run: |
          bash --version | head -1
          zsh --version
          expect -v

      - name: Run both generated editor targets
        working-directory: shemacs
        run: make test
